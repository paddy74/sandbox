# Not a published package: the build backend exists only so Databricks can
# `%pip install -e` the repo and notebooks/app can `import obj_resolution` shared helpers.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "objresolution-demo"
version = "0.1.0"
description = "Observation-to-object resolution demo using Databricks Free Edition."
readme = "README.md"
requires-python = ">=3.12"

# List only what serverless lacks so installs stay fast.
dependencies = [
    "rdflib>=7.0",
    "folium>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["obj_resolution"]

[dependency-groups]
# Local development only (not installed on Databricks).
dev = [
    "basedpyright>=1.35.0",
    "pytest>=9.0.1",
    "ruff>=0.14.8",
    # Shipped with Databricks serverless, but not in local dev env
    #"pyspark>=3.5",
    "pandas>=2.0",
    "numpy>=1.27",
    "scikit-learn>=1.3",
    "mlflow>=2.7",
    "requests>=2.32",
]

[tool.basedpyright]
include = ["obj_resolution", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
pythonPlatform = "All"
# Notebooks use Databricks globals (spark, dbutils, display); don't type-check them.
exclude = ["notebooks", "app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
ignore = ["E203", "E501"]
select = ["C", "E", "F", "I", "W", "B"]
extend-select = ["UP"]  # pyupgrade

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["F821", "E402"]  # notebooks only: undefined spark/dbutils/display; imports after %pip cells

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["notebooks"]  # import notebooks/pipeline as `pipeline`, as the notebook does
